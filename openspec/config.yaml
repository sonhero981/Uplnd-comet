schema: spec-driven

context: |
  # Artifact language
  # Write the prose of proposal, design, tasks and spec in Vietnamese; keep technical terms, code identifiers, file paths and Jira keys in English.
  # Keep OpenSpec structure in English exactly, because tools parse it: section headings from the templates (## Why, ## What Changes, ## Impact …),
  # ## ADDED/MODIFIED/REMOVED Requirements, ### Requirement:, #### Scenario:, and the keywords SHALL / MUST / WHEN / THEN.
  # This deliberately overrides Comet's default artifact language `en` (.comet/config.yaml): Comet 0.5.2 accepts only en or zh-CN for classic.language.

  # Naming convention
  # changes/ : <module>-<change-name>/   (comet flat scan — no nested change dirs), e.g. user-account-manager-relations
  #            The name NEVER contains a repo: the repos of a change are the [<repo>] groups inside its tasks.md.
  # specs/   : <product>/<module>/<capability>/spec.md (reference list: openspec/products.yaml)
  # delta specs of a change use the same nested path: changes/<change>/specs/<product>/<module>/<capability>/spec.md

  # Repo → code path mapping (all repos are siblings of this one)
  # When exploring or designing, navigate to the relevant repo and read its CLAUDE.md first.
  lms-package → ../lms-package/packages/   # shared @upbase-tech/* (pnpm + turbo)
  lms-be      → ../lms-be/apps/            # NestJS · Nx · TypeORM · Kafka
  ops-fe      → ../ops-fe/apps/ ../ops-fe/features/ ../ops-fe/libs/   # Vite · React Router · pnpm monorepo
  lms-fe      → ../lms-fe/apps/            # Next.js 14 (lms-pro, lms-test, lms-zoom)

  # Build order for a change that touches several repos: lms-package → lms-be → ops-fe → lms-fe

  # Code knowledge base
  # docs/codekb/<repo>/ (architecture.md, code-structure.md, areas/*.md …) is the verified picture of each repo's code on origin/staging (origin/main for lms-package).
  # Read it for every repo the change touches before exploring or designing; verify the lines you rely on in the code; cite them as repo:path:line.
  # If `node scripts/codekb-status.mjs <repo>` is not CURRENT, treat that repo's codekb as a hint and say so. Refresh with /comet-codekb.
  # Live code lookup: each repo has a CodeGraph index. Use it before grep/Read (codegraph_explore, codegraph_callers, or `codegraph callers <symbol> -p ../<repo>`),
  # name symbols rather than topics, pass the repo path, and check lines on the branch being edited (the index reads the working tree, the codekb reads origin/<base>).

rules:
  proposal:
    - 'When the change implements an approved PRD, put a line `PRD: <feature code>` right after the title, for example `PRD: LMS-F001` (several codes comma-separated). The key `PRD:` stays English and spelled exactly so, because scripts/prd-status.mjs and /comet-start read it. Omit the line for a hotfix or tweak that implements no PRD.'
  design:
    - 'When the PRD has a technical design in the PO repo (tech-design.md, fe-technical-design.md), start design.md with the line `Tech design: <path> @ <PO repo commit>` and point to it instead of copying it; record only the decisions that are specific to this change.'
    - 'Ground the design in the code knowledge base: for each repo the change touches, read docs/codekb/<repo>/architecture.md, code-structure.md and the matching areas/*.md, reuse the components and constraints they record instead of rediscovering them, and cite them as repo:path:line. Name any codekb that is not CURRENT (node scripts/codekb-status.mjs) as an open risk.'
  tasks:
    - 'Group tasks by repo: every group heading is `## N. [<repo>] <title>` with the repo id exactly one of lms-package, lms-be, ops-fe, lms-fe. One repo per group (a repo may have several groups), groups in build order lms-package → lms-be → ops-fe → lms-fe. scripts/changes.mjs reads the [<repo>] tag to show per-repo progress.'
